<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/hinario.css">
    <title>NOSSO HINARIO</title>

</head>

<body>
    <main>
        <div class="content-section">
            <p style="font-size:var(--musicFontSize); color:darkmagenta "><a href="index.html">Índice</a></p>

            <h4 id="hymnHeader">1 - TÍTULO</h4>
            <p id="letra" style="font-size:var(--musicFontSize); white-space: pre-wrap;line-height: 1.9;"></p>
            <br>
            <p id="copyright">Copyright © 2026 - NOSSO HINÁRIO</p>
            <br>
            <p><a href="index.html" class="footnote-link">Índice</a></p>

            <p id="mensagem"></p>
        </div>
    </main> 

    <script>
        let hinosCarregados = [];
        const params = new URLSearchParams(document.location.search);
        const Id1 = params.get("Id");

        const mensagem = document.getElementById('mensagem');


        async function CarregaDadosDoHino() {       

        try {
                console.log("CarregarDados");

                const resposta = await fetch('./json/hinos.json', { cache: 'no-store' });

                if (!resposta.ok) throw new Error('Não foi possível carregar hinos.json (erro ' + resposta.status + ')');

                const catalogo = await resposta.json();

                //Se o json for um array usa "catalogo". Se houver um membro que não é array, procura "catalogo.hinos". Se este não existir devolve []
                hinosCarregados = Array.isArray(catalogo) ? catalogo : (catalogo.hinos || []);

                console.log('Hinos carregados: ' + hinosCarregados.length);

                if(hinosCarregados.length>0)
                {
                    MontaHino();
                }
                else{
                    throw new Error('O arquivo do índice está vazio.');
                }

            } catch (erro) {
                mensagem.textContent = 'Não foi possível carregar o índice de hinos.' +  erro.message;
            }
        }

        function MontaHino()
        {
            let hino = hinosCarregados.find(h => h.id == Id1);
            if(hino != null)
            {
                document.getElementById('hymnHeader').textContent = hino.numero + ' - ' + hino.nome;

                //Busca a letra do hino no arquivo especificado em hino.arquivo
                ReadHymn(hino.arquivo);
            }
            else{
                console.error('Hino não encontrado: ' + Id1);
                mensagem.textContent = 'Hino não encontrado: ' + Id1;
            }
        }

        function Parameters_FontSize_Load()
        {
            if(typeof(Storage) != "undefined") {
                let storedFontSize = localStorage.getItem("musicFontSize");
                if(storedFontSize != null) {

                    let n = parseFloat(storedFontSize);
                    if(isNaN(n) || n < 1 || n > 3)
                    {
                        console.warn("Valor inválido de musicFontSize no localStorage: " + storedFontSize);
                        return;
                    }

                    //Atualiza variável CSS --musicFontSize com o valor armazenado
                    document.documentElement.style.setProperty('--musicFontSize', (n + "rem"));

                    console.log("Tamanho da fonte para o hino: " + n);
                }
            }
        }


        function Parameters_Theme_Load()
        {
            if(typeof(Storage) != "undefined") 
            {
                let storedThemeMode = localStorage.getItem("themeMode");

                console.log("Modo de tema armazenado: " + storedThemeMode);

                if(storedThemeMode != null) {

                    //ThemeMode_Toggle({ target: themeRadio });
                    ThemeMode_Toggle222({target:{value:storedThemeMode}});
                }
            }
        }

        function ThemeMode_Toggle222(e) {
            let element = document.body;

            if(e.target.value == "1")
            {   
                element.classList.remove("dark-mode");         
                element.classList.toggle("light-mode");
            }
            else if(e.target.value == "2")
            {
                //document.body.classList.remove("dark-mode");
                //Parameters_Theme_Save("light");
                element.classList.remove("light-mode");
                element.classList.toggle("dark-mode");
            }
        }


        async function ReadHymn(arquivoHino)
        {
            try
            {
                const resposta = await fetch(arquivoHino, { cache: 'no-store' });

                if (!resposta.ok) throw new Error('Não foi possível carregar o arquivo do hino (erro ' + resposta.status + ')');

                document.getElementById('letra').textContent =  await resposta.text();
            
            } catch (erro) {
                console.error('Não foi possível carregar a letra deste hino. ' +  erro.message);
                mensagem.textContent = 'Não foi possível carregar o arquivo do hino. ' +  erro.message;
            }
        }

        function Relatorio()
        {
            let txt = '';
            for(let i=0;i<hinosCarregados.length;i++)
            {
                txt += "==========\n";
                txt += hinosCarregados[i].nome + '\n' + hinosCarregados[i].numero + '\n' + hinosCarregados[i].arquivo;

            }

            mensagem.textContent = txt;
        }



        window.onload = function() {
        
        //Atualiza variáveis globais para ordenação
        Parameters_FontSize_Load();
        Parameters_Theme_Load();

        

        //console.log('Id: ' + Id1); // + ' - sortBy: ' + sortBy + ' - sortDirection: ' + sortDirection);

        //Testa remoção
        //localStorage.removeItem("sortBy");
        //localStorage.removeItem("sortDirection");

        CarregaDadosDoHino();
        };
    </script>
    </main>
    </body>
</html>
