<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/hinario.css">
    <title>NOSSO HINARIO</title>

    <style>
        body{
            background-color: var(--bodyBackground);
        }
    </style>
</head>


<body>
    <div id="songMainDiv">
        <br>
        <a id="top-index" class="index-button" href="index.html">ÍNDICE</a>
        
        <div class="songClass">
            <p id="songHeader">TÍTULO</p>
            <p id="letra">Carregando...</p>
            <br/>
            <p id="copyright"></p>
        </div>
        
        <p id="mensagem" class="hidden"></p>
        <div>
            <a class="index-button" href="index.html">ÍNDICE</a>
            <a id="btnSobe" href=# class="index-button">SOBE</a>            
        </div>

    <!-- </main>  -->

    <script>
        let finalHeight = 0;
        let hinosCarregados = [];

        const catalogPath = "./json/hinos.json";
        const params = new URLSearchParams(document.location.search);
        const Id1 = params.get("Id");
        const letraSection = document.getElementById('letra');

        const mensagem = document.getElementById('mensagem');


        async function CarregaJsonDosHinos() {       

        try {
                //console.log("CarregarDados");

                if (window.location.protocol === 'file:') {
                    throw new Error('Este aplicativo deve ser aberto por um servidor local. Execute "python -m http.server" e abra http://localhost:8000');
                }

                //const resposta = await fetch('hinos.json', { cache: 'no-store' });
                const resposta = await fetch(catalogPath, { cache: 'no-store' });

                if (!resposta.ok) throw new Error('Não foi possível carregar hinos.json (erro ' + resposta.status + ')');

                const catalogo = await resposta.json();

                //Se o json for um array usa "catalogo". Se houver um membro que não é array, procura "catalogo.hinos". Se este não existir devolve []
                hinosCarregados = Array.isArray(catalogo) ? catalogo : (catalogo.hinos || []);

                console.log('Hinos carregados: ' + hinosCarregados.length);

                if(hinosCarregados.length>0)
                {
                    Hino_Monta();
                }
                else{
                    throw new Error('O arquivo do índice está vazio.');
                }

            } catch (erro) {
                mensagem.textContent = 'Não foi possível carregar o índice de hinos.' +  erro.message;
            }
        }

        //PARA TESTAR DELAY DE FETCH
        function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
        }


        function Hino_Monta()
        {
            let hino = hinosCarregados.find(h => String(h.id) === String(Id1));
            let info=[];

            if(hino != null)
            {
                document.getElementById('songHeader').textContent = hino.numero + ' - ' + hino.titulo.trim();

                //document.getElementById('hymnNumber').textContent = "Num. " + hino.numero;

                //Busca a letra do hino no arquivo especificado em hino.arquivo
                //O NOME DE ARQUIVO TEM QUE SER IDÊNTIICO AO DO DISCO (CAIXA ALTA/BAIXA)
                Song_GetFile(hino.arquivo);

                if(hino.autor != undefined && hino.autor.trim().length>0)
                {        
                    info.push(hino.autor);
                }

                if(hino.copyright != undefined && hino.copyright.trim().length>0)
                {         
                   info.push(hino.copyright);
                }

                if(info.length >0)
                {
                    document.getElementById('copyright').textContent = info.join('\n');
                }
                else
                {                    
                    document.getElementById('copyright').classList.add('hidden');
                }
            }
            else{
                document.getElementById("songHeader").textContent = '';
                letraSection.textContent= 'Hino não encontrado.';

                ToggleButtonVisiblity();
            }
        }

        function Parameters_FontSize_Load()
        {
            if(typeof(Storage) != "undefined") {
                let storedFontSize = localStorage.getItem("baseFontSize");
                if(storedFontSize != null) {

                    let n = parseFloat(storedFontSize);
                    if(isNaN(n) || n < 0.5 || n > 2)
                    {
                        console.warn("Valor inválido de baseFontSize no localStorage: " + storedFontSize);

                        return;
                    }

                    //Atualiza variável CSS --baseFontSize com o valor armazenado
                    document.documentElement.style.setProperty('--baseFontSize', (n + 'em'));

                    console.log("Tamanho da fonte para o hino: " + n);
                }
            }
        }


        function Parameters_Theme_Load()
        {
            if(typeof(Storage) != "undefined") 
            {
                let storedThemeMode = localStorage.getItem("themeMode");

                console.log("Modo de tema armazenado: " + storedThemeMode);

                if(storedThemeMode != null) {

                    //ThemeMode_Toggle({ target: themeRadio });
                    ThemeMode_Toggle({target:{value:storedThemeMode}});
                }
            }
        }

        function ThemeMode_Toggle(e) {
            let element = document.body;

            if(e.target.value == "1")
            {   
                element.classList.remove("darkTheme");         
                element.classList.add("lightTheme");
            }
            else if(e.target.value == "2")
            {
                //document.body.classList.remove("dark-mode");
                //Parameters_Theme_Save("light");
                element.classList.remove("lightTheme");
                element.classList.add("darkTheme");
            }
        }


        async function Song_GetFile(arquivoHino)
        {
            try
            {
                if (window.location.protocol === 'file:') {
                    throw new Error('Este aplicativo deve ser aberto por um servidor local. Execute "python -m http.server" e abra http://localhost:8000');
                }

                const resposta = await fetch(arquivoHino, { cache: 'no-store' });

                if (!resposta.ok) throw new Error('Não foi possível carregar o arquivo do hino (erro ' + resposta.status + ')');

                const result =  await resposta.text();

                //Se houver "coro", formato o texto correspondente
                MontaCoro(result);

                //Exibe ou oculta o botão SOBE e o do índice superior
                ToggleButtonVisiblity();
            
            } catch (erro) {
                console.error('Não foi possível carregar a letra deste hino. ' +  erro.message);
                mensagem.textContent = 'Não foi possível carregar o arquivo do hino. ' +  erro.message;
            }
        }

        //Se houver a palavra "coro", formata o texto do coro
        function MontaCoro(txt)
        {
            letraSection.textContent='';

            let splitted = txt.split(/coro/i);

            for (let i=0; i<=(splitted.length-1); i++)
            {
                if(i==0)
                {
                    const txt1 = document.createTextNode(splitted[i].trim());
                    letraSection.appendChild(txt1);
                }
                else
                {
                    if(i%2 ==0) // Se for par, não é span
                    {
                        const txt2 = document.createTextNode(splitted[i].trim());
                        letraSection.appendChild(txt2);
                    }
                    else //ímpar = span
                    {
                        const sp1 = document.createElement('span');          
                        const txt2 = document.createTextNode(splitted[i].trimEnd());
                        const space = document.createElement('br');

                        sp1.appendChild(txt2);
                        letraSection.appendChild(sp1);          
                        letraSection.appendChild(space);
                    }
                } 
            }
        }

          //Exibe ou esconde os botões SOBE E ÍNDICE superior se o documento sangrar
        function ToggleButtonVisiblity()
        {
            const btn1 = document.getElementById('btnSobe');
            const btn2 = document.getElementById('top-index');

            finalHeight = songMainDiv.offsetHeight;

            if(finalHeight > screen.height)
            {
                btn1.classList.remove('hidden');
                btn2.classList.remove('hidden');

                //console.log("MAIOR");
            }
            else
            {
                btn1.classList.add('hidden');
                btn2.classList.add('hidden');

                //console.log("MENOR OU IGUAL")
            }
        }

        function Relatorio()
        {
            let txt = '';
            for(let i=0;i<hinosCarregados.length;i++)
            {
                txt += "==========\n";
                txt += hinosCarregados[i].id + '\n' + hinosCarregados[i].titulo + '\n' + hinosCarregados[i].numero + '\n' + hinosCarregados[i].arquivo;

            }

            console.log(txt);
        }


        window.onload = function() {
        
            //Atualiza variáveis globais
            Parameters_FontSize_Load();
            Parameters_Theme_Load();   

            //Testa delay
           // delay(3000).then(() => {console.log("xxxxxxx This runs after 2 seconds"); CarregaJsonDosHinos();});

            CarregaJsonDosHinos();

            //console.log('Id: ' + Id1); // + ' - sortBy: ' + sortBy + ' - sortDirection: ' + sortDirection);
        };
    </script>
    </div>
    </body>
</html>
