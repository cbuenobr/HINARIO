<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/hinario.css">
    <script src="./scripts/hinario.js" type="text/javascript" defer></script>

    <title>NOSSO HINARIO</title>
</head>
<body>
    <div id="header">
        <span style="font-size:40px;">NOSSO HINÁRIO</span>
        <span id="menuIcon" style="font-size:40px;cursor:pointer; float:right; padding-right: 10px;"  onclick="openNav()">&#8942;</span>
    </div>

    <h1 style="color:rgb(255, 0, 0); text-align: center;"> (***** TESTE *****)</h1>
    <p id="current-date" style="text-align: center;"></p>

    <div id="sideMenu">
        <div id="mySidenav" class="sidenav">
            <a href="javascript:void(0)" onclick="OpenFontSizeMenu()">Aa</a>
            <hr>
            <a href="javascript:void(0)" onclick="OpenSortMenu()">Ordenar</a>
            <hr>
            <a href="javascript:void(0)" onclick="OpenThemeMenu()">Cor do fundo</a>
            <hr>
            <a href="#">admin</a>
        </div>

        <div id="fontSizeMenu" class="fontSizeMenu">
            <div style="text-align:left; margin-left: 20px;">
                <label for="fontSizeRange" style=" font-size:x-large;">Aa</label>
                <input type="range" id="fontSizeRange" class="slidecontainer" min="1" max="3" step="0.1" width="300px" >
            </div>
        </div>

        <div id="sortMenu" class="sortMenu">
            <p>Ordenar por:</p>
            <label for="sortByName">Nome</label>
            <input type="radio" id="sortByName" name="sortBy"  checked="true" value="1"><br>
            <label for="sortByNumber">Número</label>
            <input type="radio" id="sortByNumber" name="sortBy" value="2"><br>
            <hr>
            <p>Direção:</p>
            <label for="sortDir_1">Crescente</label>
            <input type="radio" id="sortDir_1" name="sortDirection"  checked="true" value="1"><br>
            <label for="sortDir_2">Decrescente</label>
            <input type="radio" id="sortDir_2" name="sortDirection" value="2">
        
        </div>

        <div id="themeMenu" class="themeMenu">
            <p>Fundo:</p>
            <input type="radio" id="white-theme" name="theme"  checked="true" value="1" onclick="ThemeMode_Toggle(event)">
            <label for="white-theme">Claro</label><br>
            <input type="radio" id="dark_theme" name="theme" value="2" onclick="ThemeMode_Toggle(event)">
            <label for="dark_theme">Escuro</label>
        </div>
    </div>

    <hr>
    <h1 id="indexHeader" style="text-align:center; font-size: var(--indexFontSize);">ÍNDICE</h1>

    <table id="table-index" class="index-container"></table>
    </table>

    <hr>
    <p id="mensagem"></p>
</body>
</html>
