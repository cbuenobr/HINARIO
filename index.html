<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/hinario.css">
    <script src="./scripts/hinario.js" type="text/javascript" defer></script>

    <title>NOSSO HINARIO</title>
</head>
<body>
    <div id="headerGroup">
        <span id="headerTitle">NOSSO HINÁRIO</span>
        <span id="menuIcon" onclick="openNav()">&#8942;</span>
    </div>

    <p style="color:rgb(255, 0, 0); text-align: center;"> (***** TESTE *****)</p>
    <p id="current-date" style="text-align: center; font-size:70%"></p>

    <div id="sideMenu">
        <div id="mySidenav" class="sidenav">
            <a href="javascript:void(0)" onclick="OpenFontSizeMenu()">Aa</a>
            <hr>
            <a href="javascript:void(0)" onclick="OpenSortMenu()">Ordenar</a>
            <hr>
            <a href="javascript:void(0)" onclick="OpenThemeMenu()">Cor do fundo</a>
        </div>

        <div id="fontSizeMenu" class="fontSizeMenu">
            <div>
                <label for="fontSizeRange">Aa</label>
                <input type="range" id="fontSizeRange" class="slidecontainer" min="0.5" max="2" step="0.1">
            </div>
        </div>

        <div id="sortMenu" class="sortMenu">
            <p>Ordenar por:</p>
            <input type="radio" id="sortByName" name="sortBy"  checked="true" value="1">
            <label for="sortByName">Nome</label><br>

            <br/>

            <input type="radio" id="sortByNumber" name="sortBy" value="2">
            <label for="sortByNumber">Número</label>

            <br/>
            <br/>
            
            <hr>
            <p>Direção:</p>
            <input type="radio" id="sortDir_1" name="sortDirection"  checked="true" value="1">
            <label for="sortDir_1">Crescente</label><br>

            <br/>

            <input type="radio" id="sortDir_2" name="sortDirection" value="2">
            <label for="sortDir_2">Decrescente</label>         
        </div>

        <div id="themeMenu" class="themeMenu">
            <p>Fundo:</p>
            <input type="radio" id="white-theme" name="theme"  checked="true" value="1" onclick="ThemeMode_Toggle(event)">
            <label for="white-theme">Claro</label><br>

            <br/>

            <input type="radio" id="dark_theme" name="theme" value="2" onclick="ThemeMode_Toggle(event)">
            <label for="dark_theme">Escuro</label>
        </div>
    </div>

    <hr>
    <p id="indexHeader">ÍNDICE</p>

    <table id="table-contents"></table>
    
    <hr>
    <p id="mensagem"></p>
    <p id="admin">Admin</p>
</body>
</html>
