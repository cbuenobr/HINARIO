<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/hinario.css">
    <script src="./scripts/hinario.js" type="text/javascript" defer></script>

    <title>NOSSO HINARIO</title>

</head>
<body>
    <main>
        <h1 style="text-align: center;">NOSSO HINÁRIO</h1>
        <h1 style="color:rgb(255, 0, 0); text-align: center;"> (***** TESTE *****)</h1>
        <p id="current-date" style="text-align: center;"></p>

        <hr>
        <!-- SLIDER TAMANHO DA FONTE DAS MÚSICAS -->
        <div style="text-align:left; margin-left: 20px;">
            <label for="fontSizeRange" style="font-weight: bold; font-size:x-large;">Aa</label>
            <input type="range" id="fontSizeRange" class="slidecontainer" min="1" max="3" step="0.1" >
        </div>

        <p>Ordenar por:</p>
        <input type="radio" id="sortByName" name="sortBy"  checked="true" value="1">
        <label for="sortByName">Nome</label>
        <input type="radio" id="sortByNumber" name="sortBy" value="2">
        <label for="sortByNumber">Número</label>

<!--         <p>Direção:</p>
        <input type="radio" id="sortDir_1" name="sortDirection"  checked="true" value="1">
        <label for="sortDir_1">Crescente</label>
        <input type="radio" id="sortDir_2" name="sortDirection" value="2">
        <label for="sortDir_2">Decrescente</label> -->

        <a href="javascript:javascript:void(0)"><img id="arrowDown" src="./img/down.png"></a>
        <a href="javascript:javascript:void(0)"><img id="arrowUp" src="./img/up.png"></a>
       

        <!-- <button id="btnSort">OK</button> -->

        <p>Fundo:</p>
        <input type="radio" id="white-theme" name="theme"  checked="true" value="1" onclick="ThemeMode_Toggle(event)">
        <label for="white-theme">Claro</label>
        <input type="radio" id="dark-theme" name="theme" value="2" onclick="ThemeMode_Toggle(event)">
        <label for="dark-theme">Escuro</label>
        
        <h1 id="indexHeader" style="text-align:center; font-size: var(--indexFontSize);">ÍNDICE</h1>

        <table id="table-index" class="index-container" style="font-size:var(--indexFontSize); display:block;">
        </table>

        <hr>

        <p id="mensagem"></p>
    </main>
</body>
</html>
