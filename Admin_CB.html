<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/admin_CB.css">
    <script src="./scripts/admin_CB.js" type="text/javascript" defer></script>

    <title>TESTE DROPDOWN</title>
</head>

<style>



</style>
<body>
  <main>
    <h1>ADMINISTRADOR</h1>

    <div id="startOptions">
      <div class="admin-actions">
        <button class="primary" onclick="Song_New()">NOVO HINO</button>
      </div>
      <hr>

      <p id="editHeader">EDITAR HINO</p>

      <table id="edit-table"></table>
    </div>
      <hr>
    <br><br>


    <div id="formArea" class="hidden">
      <div class="field">
        <label for="numero">Número do hino</label>
        <input id="numero" type="number" min="1" inputmode="numeric">
      </div>

      <div class="field">
        <label for="titulo">Título</label>
        <input id="titulo" type="text">
      </div>

      <div class="field">
        <label for="letra">Letra</label>
        <textarea id="letra">CARREGANDO...</textarea>
      </div>

      <div class="field">
        <label for="copyright">Copyright</label>
        <!-- <input id="copyright" type="text"> -->
         <textarea id="copyright"></textarea>
      </div>

      <div class="form-actions">
        <button class="primary" id="salvarBtn" onclick="Song_Save()">Salvar</button>
        <button onclick="Edicao_Cancelar()">Cancelar</button>
        <button onclick="Edicao_Cancelar()">Voltar</button>

        <button class="danger hidden" id="excluirBtn" onclick="excluirAtual()">Excluir hino</button>
      </div>

      <p id="formMsg" class="message"></p>
    </div>


    <p id="mensagem"></p>
    <button onclick="Edicao_Sair()">Sair</button>
    </main>
</body>
