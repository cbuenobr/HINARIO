<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./styles/contact.css">
</head>

<body>
<title>NOSSO HINARIO - Contato</title>

<div class="container">

    <form id="contactForm" name="contactForm" action="contact_callback.html" method="POST" netlify>
    <p id="header">Contato</p>

    <p>
        <label>Nome: <input type="text" id="username" name="username" required/></label>
    </p>

    <p>
        <label>Cidade: <input id="city" type="text" name="city" required/></label>
    </p>

    <p>
        <label for="state">Estado</label>
        <select id="state" name="state" required>
            <option selected disabled value="">-- Selecione --</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
        </select>
    </p>

    <div id="contact-options">
        <p>Como prefere ser contactado?</p>
    
        <p>
            <label>Email: <input type="email" id="email" name="email" /></label>
        </p>

        <p>
            <img src="img/whatsapp02.png" height="20px" width="20px" style="vertical-align: middle;" ></img>
            <label style="vertical-align: middle;">Whatsapp: <input id="phone" type="tel" name="phone" placeholder="(xx)xxxxx-xxxx"/></label>
        </p>
    </div>

    <p></p>

    <p>
        <label>Mensagem: </label>
        <textarea id="contactMsg" name="contactMessage" placeholder="Escreva sua mensagem.." style="height:200px" required></textarea>
    </p>
    <p>
        <button type="submit">ENVIAR</button>
    </p>

    <p>
        <!-- Especificando o tipo como 'button', o formulário não é enviado-->
        <button id="cancelBtn" type='button' style="color:crimson" onclick="window.location.href = 'index.html'" >CANCELAR</button>
    </p>
    </form>
</div>


<!-- POPUP -->
<div class="popup-wrapper">
    <div class="popup">
        <div class="popup-close">X</div>
        <div class="popup-content">
            <h3>Informe um endereço de email ou seu número de Whatsapp</h3>
        </div>
    </div>
</div>


<script>
    const contactForm = document.getElementById("contactForm");
    const usernameEntry = document.getElementById("username");
    const cityEntry = document.getElementById("city");
    const emailEntry = document.getElementById("email");
    const phoneEntry = document.getElementById("phone");
    const msgEntry = document.getElementById("contactMsg");


    //POPUP
    const popup = document.querySelector('.popup-wrapper');
    const close = document.querySelector('.popup-close');


    const regexPhone = /^(?:\+?55\s?)?(?:\(?[1-9][0-9]\)?\s*?)?9\d{4}-?\d{4}$/;

    //Associa a regex
    phoneEntry.setAttribute("pattern", regexPhone.source);


    //EVENTOS ---------------------------------------------------------

    //Valida nome usuário (obrigatório)
    usernameEntry.addEventListener('input', function () {
        if (usernameEntry.value.length < 3) {
            usernameEntry.setCustomValidity('Digite o seu nome');
        } else {
            usernameEntry.setCustomValidity('');
        }
    });


    //Valida cidade (obrigatório)
    cityEntry.addEventListener('input', function () {
        if (cityEntry.value.length < 2) {
            cityEntry.setCustomValidity('Digite sua cidade');
        } else {
            cityEntry.setCustomValidity('');
        }
    });

    
    //Valida email (caso usuário digite)
    emailEntry.addEventListener("input", (event) => {
    if (emailEntry.validity.typeMismatch) {

        emailEntry.setCustomValidity("Digite um endereço de email válido");
    } 
    else 
    {
        emailEntry.setCustomValidity("");
    }
    });

    //Valida telefone (caso usuário digite)
    phoneEntry.addEventListener("input", (event) => {
        if (phoneEntry.validity.patternMismatch) {

            phoneEntry.setCustomValidity("Digite o número de telefone com DDD");
        } 
        else 
        {
            phoneEntry.setCustomValidity("");
        }
    });

    //Valida mensagem
    msgEntry.addEventListener("selectionchange", function() {

        if (/^\s*$/g.test(msgEntry.value)){

            msgEntry.setCustomValidity("Escreva sua mensagem");
        } 
        else 
        {
            msgEntry.setCustomValidity("");
        } 
    });


    //Evento SUBMIT
    contactForm.addEventListener('submit', (event)=>{

        //Nem email nem telefone foram informados
        if(emailEntry.value.trim().length == 0 && phoneEntry.value.trim().length == 0) 
        {
            //Exibe o popup
            popup.style.display = 'block';

           event.preventDefault();
        } ;


    });


    //EVENTOS DO POPUP
    close.addEventListener('click', ()=>{popup.style.display='none';});
    popup.addEventListener('click', ()=>{popup.style.display='none';});
</script>

</body>
</html>
